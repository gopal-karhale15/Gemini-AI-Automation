services:
  redis:
    image: redis:7-alpine
    container_name: gemini-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: gemini-automation
    ports:
      - "8080:8080"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - redis